<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚛 DRIVER APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-cyan: #00FFFF;
            --primary-blue: #0066CC;
            --dark-bg: #0a0a2a;
            --card-bg: rgba(10, 10, 42, 0.8);
            --accent-purple: #8A2BE2;
            --success-green: #00FF7F;
            --warning-orange: #FF8C00;
            --danger-red: #FF4500;
            --text-light: #E0E0FF;
            --glow-cyan: 0 0 15px #00FFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, var(--dark-bg) 0%, #000015 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-purple));
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid var(--primary-cyan);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: var(--glow-cyan);
        }

        .logout-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 22px; }
            .auth-box { padding: 30px 20px !important; }
        }

        .task-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-cyan);
        }

        .task-card.completed {
            border-left: 4px solid var(--success-green);
            opacity: 0.7;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: bold;
            color: var(--primary-cyan);
        }

        .completed-badge {
            background: var(--success-green);
            color: var(--dark-bg);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .admin-only {
            color: var(--warning-orange);
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-edit { background: var(--primary-cyan); color: var(--dark-bg); }
        .btn-delete { background: var(--danger-red); color: white; }
        .btn-complete { background: var(--success-green); color: var(--dark-bg); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 42, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--primary-cyan);
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--primary-cyan);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-cyan);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--primary-cyan);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--success-green), #00AA66);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--primary-cyan);
        }

        .google-btn {
            background: white;
            color: var(--dark-bg);
            border: 2px solid var(--primary-cyan);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            transform: scale(1.02);
            box-shadow: var(--glow-cyan);
        }

        .google-icon {
            width: 24px;
            height: 24px;
        }

        .loading-dots {
            display: inline-block;
            overflow: hidden;
            height: 20px;
        }

        .loading-dots:after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .task-management {
            background: rgba(138, 43, 226, 0.1);
            margin: 15px;
            border-radius: 15px;
            padding: 20px;
        }

        .status-pending { background: rgba(255, 140, 0, 0.3); color: var(--warning-orange); }
        .status-progress { background: rgba(0, 102, 204, 0.3); color: var(--primary-cyan); }
        .status-completed { background: rgba(0, 255, 127, 0.3); color: var(--success-green); }
    </style>
</head>
<body>
    <div id="login-screen" class="auth-container">
        <div class="auth-box">
            <h2 style="color: var(--primary-cyan); margin-bottom: 20px;">🚛 DRIVER APP</h2>
            <p style="margin-bottom: 30px;">Sign in to access your dashboard</p>
            <button id="auth-button" class="google-btn">
                <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHZpZXdCb3g9IjAgMCAxOCAxOCIgbm9TdHJva2U9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTE3LjgxIDI4LjY5SDEyLjYxTTYuMjcgMTcuOTZ2LTIuNzZINDB2LTIuNzhJMi4zMi0uOTUgMi4zMi0yLjM4VjkuNDNDMi4zMi0xLjA1IDAuOTUgMS4xMSAwIDEuMTE0di0uMDJjMC0uNDEtMS4zMi0uNTUtMS4zMi0uOTV2LTIuNThhMS4zMiAxLjM0IDAgMCAwLTIgMS4zNmgwdi0uMDBhMS4zMiAxLjM0IDAgIDAgLTItMS4zMnYtMi41OGE3LjUyIDcuNTIgMCAwIDEtNy41Mi03LjUyIDcuNTIgNy41MiAwIDAgMCAwIDcuNTIgNy41MiA1LjUyIDUuNTIgMCAwIDEgNy41MiA3LjUyem0tMTUuNTEgNS4xOEwxMC42OCAxMC45TDI0LjcgNC41MVotLjkgLTIuNjd6IiBmaWxsPSIjRkZGIi8+PC9zdmc+" alt="Google Icon" class="google-icon">
                Sign in with Google
            </button>
            <p style="margin-top: 20px; color: var(--warning-orange);">Loading Firebase...</p>
        </div>
    </div>

    <div id="dashboard-content" style="display: none;">
        <div class="header">
            <h1>🚀 DRIVER APP</h1>
            <p>Welcome, <span id="user-name">User</span>! 🌟 <span id="role-badge"></span></p>
            <button class="logout-btn" onclick="logout()">🔐 Logout</button>
        </div>

        <div id="admin-panel" style="display: none;">
            <div class="task-management">
                <h3>👑 ADMIN PANEL</h3>
                <p style="color: var(--warning-orange);">Admin can manage all tasks</p>
            </div>
        </div>

        <div id="member-panel" style="display: none;">
            <div class="task-management">
                <h3>👤 MEMBER PANEL</h3>
                <p style="color: var(--primary-cyan);">Member can add/edit tasks</p>
            </div>
        </div>

        <div class="task-management">
            <h3>📋 TASKS</h3>
            <button class="btn-submit" onclick="openTaskModal()" id="add-task-btn">➕ ADD NEW TASK</button>
            <div id="tasks-container"></div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTaskModal()">&times;</span>
            <h3 style="color: var(--primary-cyan); margin-bottom: 20px;">📝 TASK DETAILS</h3>

            <div class="form-group">
                <label class="form-label">Task Title</label>
                <input type="text" id="taskTitle" class="form-input" placeholder="Enter task title...">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" id="taskDescription" class="form-input" placeholder="Enter description...">
            </div>

            <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-input" id="taskStatus">
                    <option value="Pending">Pending</option>
                    <option value="InProgress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <button class="btn-submit" onclick="saveTask()">💾 SAVE TASK</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBsMZFdyciKjpcSufC4IbSxlehQ50zviEQ",
            authDomain: "driver-app-auth-b87de.firebaseapp.com",
            projectId: "driver-app-auth-b87de",
            storageBucket: "driver-app-auth-b87de.firebasestorage.app",
            messagingSenderId: "691923028632",
            appId: "1:691923028632:web:e9813913d01788947c1eed"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userRole = null;
        let currentTaskId = null;

        // Initialize auth state listener immediately
        auth.onAuthStateChanged(async user => {
            const loginScreen = document.getElementById('login-screen');
            const dashboardContent = document.getElementById('dashboard-content');

            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                dashboardContent.style.display = 'block';
                document.getElementById('user-name').textContent = user.displayName || 'User';

                await checkUserRole();
                loadTasks();
            } else {
                loginScreen.style.display = 'flex';
                dashboardContent.style.display = 'none';
            }
        });

        // Setup Google Sign-In button
        document.addEventListener('DOMContentLoaded', function() {
            const authButton = document.getElementById('auth-button');
            if (authButton) {
                authButton.addEventListener('click', handleGoogleSignIn);
            }
        });

        function handleGoogleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('profile');
            provider.addScope('email');

            auth.signInWithPopup(provider)
                .then((result) => {
                    console.log('Sign in successful', result.user);
                })
                .catch((error) => {
                    console.error('Sign in error', error);
                    alert('Login failed: ' + error.message);
                });
        }

        async function checkUserRole() {
            try {
                const userDoc = await db.collection('users').doc(currentUser.uid).get();
                userRole = userDoc.exists ? userDoc.data().role : 'member';

                document.getElementById('role-badge').innerHTML =
                    userRole === 'admin' ? '<span style="background: var(--warning-orange); padding: 2px 8px; border-radius: 10px;">ADMIN</span>' : '';

                document.getElementById('admin-panel').style.display =
                    userRole === 'admin' ? 'block' : 'none';

                document.getElementById('member-panel').style.display =
                    userRole === 'member' ? 'block' : 'none';
            } catch (error) {
                console.error('Role check error:', error);
                userRole = 'member';
            }
        }

        function openTaskModal() {
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
            currentTaskId = null;
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskStatus').value = 'Pending';
        }

        async function saveTask() {
            if (!currentUser) return;

            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const status = document.getElementById('taskStatus').value;

            if (!title) {
                alert('Please enter a task title');
                return;
            }

            const taskData = {
                title: title,
                description: description,
                status: status,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: currentUser.uid
            };

            try {
                if (currentTaskId) {
                    await db.collection("tasks").doc(currentTaskId).update(taskData);
                } else {
                    await db.collection("tasks").add({
                        ...taskData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                closeTaskModal();
            } catch (error) {
                console.error('Error saving task:', error);
                alert('Error saving task: ' + error.message);
            }
        }

        function loadTasks() {
            db.collection("tasks").orderBy("createdAt", "desc")
                .onSnapshot((querySnapshot) => {
                    const container = document.getElementById('tasks-container');
                    container.innerHTML = '';

                    querySnapshot.forEach((doc) => {
                        const task = doc.data();
                        const isCompleted = task.status === 'Completed';
                        const canEditDelete = userRole === 'admin' || (!isCompleted && userRole === 'member');
                        const canDeleteCompleted = userRole === 'admin' && isCompleted;

                        const taskElement = document.createElement('div');
                        taskElement.className = `task-card ${isCompleted ? 'completed' : ''}`;

                        taskElement.innerHTML = `
                            <div class="task-header">
                                <span class="task-title">${task.title}</span>
                                <div class="task-actions">
                                    ${isCompleted ? `<span class="completed-badge">DONE</span>` : ''}
                                </div>
                            </div>
                            <div>${task.description || 'No description'}</div>
                            <div style="margin: 10px 0;">
                                <span class="btn ${getStatusClass(task.status)}">${task.status}</span>
                            </div>
                            ${userRole === 'member' && !isCompleted ?
                                `<div class="action-buttons">
                                    <button class="btn btn-edit" onclick="editTask('${doc.id}')">✏️ Edit</button>
                                    <button class="btn btn-complete" onclick="toggleComplete('${doc.id}', true)">✅ Complete</button>
                                </div>` : ''}
                            ${canDeleteCompleted ?
                                `<div class="admin-only">
                                    <button class="btn btn-delete" onclick="deleteTask('${doc.id}')">🗑️ Admin: Delete Completed</button>
                                </div>` : ''}
                            ${canEditDelete && !isCompleted ?
                                `<div class="action-buttons">
                                    <button class="btn btn-delete" onclick="deleteTask('${doc.id}')">🗑️ Delete</button>
                                </div>` : ''}
                        `;
                        container.appendChild(taskElement);
                    });
                }, (error) => {
                    console.error('Tasks listener error:', error);
                    container.innerHTML = '<p style="color: var(--danger-red);">Error loading tasks. Check console.</p>';
                });
        }

        function getStatusClass(status) {
            switch(status) {
                case 'Completed': return 'status-completed';
                case 'InProgress': return 'status-progress';
                default: return 'status-pending';
            }
        }

        function editTask(taskId) {
            if (userRole !== 'member') return;

            db.collection("tasks").doc(taskId).get().then((doc) => {
                if (doc.exists && doc.data().status !== 'Completed') {
                    const task = doc.data();
                    document.getElementById('taskTitle').value = task.title;
                    document.getElementById('taskDescription').value = task.description || '';
                    document.getElementById('taskStatus').value = task.status;
                    currentTaskId = taskId;
                    openTaskModal();
                }
            });
        }

        async function toggleComplete(taskId, completed) {
            if (userRole !== 'member') return;

            try {
                await db.collection("tasks").doc(taskId).update({
                    status: completed ? 'Completed' : 'Pending'
                });
            } catch (error) {
                console.error('Error updating task:', error);
            }
        }

        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const doc = await db.collection("tasks").doc(taskId).get();
                if (doc.exists) {
                    const status = doc.data().status;
                    // Members can only delete non-completed tasks
                    // Admins can delete any task
                    if (userRole === 'admin' || status !== 'Completed') {
                        await db.collection("tasks").doc(taskId).delete();
                    } else {
                        alert('Members cannot delete completed tasks!');
                    }
                }
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                firebase.auth().signOut();
            }
        }
    </script>
</body>
</html>
