<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚛 DRIVER APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-cyan: #00FFFF;
            --primary-blue: #0066CC;
            --dark-bg: #0a0a2a;
            --card-bg: rgba(10, 10, 42, 0.8);
            --accent-purple: #8A2BE2;
            --success-green: #00FF7F;
            --warning-orange: #FF8C00;
            --danger-red: #FF4500;
            --text-light: #E0E0FF;
            --glow-cyan: 0 0 15px #00FFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, var(--dark-bg) 0%, #000015 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-purple));
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid var(--primary-cyan);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: var(--glow-cyan);
        }

        .logout-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .logout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--danger-red);
        }

        .nav-tabs {
            display: flex;
            background: rgba(0, 102, 204, 0.3);
            padding: 10px;
            gap: 5px;
        }

        .nav-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-tab.active {
            background: var(--primary-cyan);
            color: var(--dark-bg);
            font-weight: bold;
            border-color: var(--accent-purple);
        }

        .task-management {
            background: rgba(138, 43, 226, 0.1);
            margin: 15px;
            border-radius: 15px;
            padding: 20px;
        }

        .add-task-btn {
            background: linear-gradient(45deg, var(--accent-purple), var(--primary-blue));
            color: white;
            border: 2px solid var(--primary-cyan);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .add-task-btn:hover {
            box-shadow: var(--glow-cyan);
        }

        .add-task-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-cyan);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: bold;
            color: var(--primary-cyan);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 42, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--primary-cyan);
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--primary-cyan);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-cyan);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--primary-cyan);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--success-green), #00AA66);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--primary-cyan);
        }
    </style>
</head>
<body>
    <div id="login-screen" class="auth-container">
        <div class="auth-box">
            <h2 style="color: var(--primary-cyan); margin-bottom: 20px;">🚛 DRIVER APP</h2>
            <p style="margin-bottom: 30px;">Sign in to access your dashboard</p>
            <button id="auth-button" class="add-task-btn">🔐 Sign in with Google</button>
        </div>
    </div>

    <div id="dashboard-content" style="display: none;">
        <div class="header">
            <h1>🚀 DRIVER APP</h1>
            <p>Welcome, <span id="user-name">User</span>! 🌟 <span id="role-badge"></span></p>
            <button class="logout-btn" onclick="logout()">🔐 Logout</button>

            <div class="nav-tabs">
                <div class="nav-tab active" onclick="showTab('dashboard')">DASHBOARD</div>
                <div class="nav-tab" onclick="showTab('tasks')">TASKS</div>
            </div>
        </div>

        <div id="dashboard">
            <div class="task-management">
                <h3>📋 MANAGE TASKS</h3>
                <button class="add-task-btn" onclick="openTaskModal()" id="add-task-btn">➕ ADD NEW TASK</button>
                <div id="tasks-container"></div>
            </div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTaskModal()">&times;</span>
            <h3 style="color: var(--primary-cyan); margin-bottom: 20px;">📝 TASK DETAILS</h3>

            <div class="form-group">
                <label class="form-label">Task Title</label>
                <input type="text" id="taskTitle" class="form-input" placeholder="Enter task title...">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" id="taskDescription" class="form-input" placeholder="Enter description...">
            </div>

            <div class="form-group">
                <label class="form-label">📍 Location Link</label>
                <input type="url" class="form-input" id="mapLink" placeholder="Paste map link here...">
            </div>

            <div class="form-group">
                <label class="form-label">Due Date</label>
                <input type="datetime-local" id="dueDate" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Priority</label>
                <select class="form-input" id="priority">
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>

            <button class="btn-submit" onclick="saveTask()">💾 SAVE TASK</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBsMZFdyciKjpcSufC4IbSxlehQ50zviEQ",
            authDomain: "driver-app-auth-b87de.firebaseapp.com",
            projectId: "driver-app-auth-b87de",
            storageBucket: "driver-app-auth-b87de.firebasestorage.app",
            messagingSenderId: "691923028632",
            appId: "1:691923028632:web:e9813913d01788947c1eed"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let isAdmin = false;
        let currentTaskId = null;

        auth.onAuthStateChanged(async user => {
            const loginScreen = document.getElementById('login-screen');
            const dashboardContent = document.getElementById('dashboard-content');

            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                dashboardContent.style.display = 'block';
                document.getElementById('user-name').textContent = user.displayName || 'User';

                await getUserRole(user.uid);
                updateUIForRole();
                loadTasks();
            } else {
                loginScreen.style.display = 'flex';
                dashboardContent.style.display = 'none';
            }
        });

        document.getElementById('auth-button').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(result => console.log('Sign in successful', result.user))
                .catch(error => {
                    console.error('Sign in error', error);
                    alert('Login failed: ' + error.message);
                });
        });

        async function getUserRole(userId) {
            try {
                const userDoc = await db.collection('users').doc(userId).get();
                if (userDoc.exists) {
                    isAdmin = userDoc.data().role === 'admin';
                } else {
                    // Create new user as member
                    await db.collection('users').doc(userId).set({
                        uid: userId,
                        email: currentUser.email,
                        displayName: currentUser.displayName,
                        role: 'member',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    isAdmin = false;
                }
            } catch (error) {
                console.error('Error getting user role:', error);
                isAdmin = false;
            }
        }

        function updateUIForRole() {
            const addTaskBtn = document.getElementById('add-task-btn');
            if (addTaskBtn) {
                addTaskBtn.disabled = !isAdmin;
                if (!isAdmin) {
                    alert('You are a member. Admins will manage tasks.');
                }
            }
        }

        function loadTasks() {
            db.collection("tasks").orderBy("createdAt", "desc")
                .onSnapshot((querySnapshot) => {
                    const tasksContainer = document.getElementById('tasks-container');
                    if (!tasksContainer) return;

                    if (!isAdmin) {
                        tasksContainer.innerHTML = '<p style="color: var(--warning-orange);">You are a member. Admins manage all tasks.</p>';
                        return;
                    }

                    tasksContainer.innerHTML = '';

                    querySnapshot.forEach((doc) => {
                        const task = doc.data();
                        const taskElement = document.createElement('div');
                        taskElement.className = 'task-card';
                        taskElement.innerHTML = `
                            <div class="task-header">
                                <span class="task-title">${task.title}</span>
                                <div class="task-actions">
                                    <i class="fas fa-edit" onclick="editTask('${doc.id}')"></i>
                                    <i class="fas fa-trash" onclick="deleteTask('${doc.id}')"></i>
                                </div>
                            </div>
                            <div>Due: ${task.dueDate || 'No date'}</div>
                            <div>Priority: ${task.priority}</div>
                        `;
                        tasksContainer.appendChild(taskElement);
                    });
                });
        }

        async function saveTask() {
            if (!currentUser) {
                alert('Please sign in first');
                return;
            }

            const titleInput = document.getElementById('taskTitle');
            const descriptionInput = document.getElementById('taskDescription');
            const mapLinkInput = document.getElementById('mapLink');
            const dueDateInput = document.getElementById('dueDate');
            const prioritySelect = document.getElementById('priority');

            if (!titleInput) {
                alert('Form not loaded. Please refresh the page.');
                return;
            }

            const title = titleInput.value.trim();
            const description = descriptionInput?.value.trim() || '';
            const mapLink = mapLinkInput?.value.trim() || '';
            const dueDate = dueDateInput?.value || '';
            const priority = prioritySelect?.value || 'Medium';

            if (!title) {
                alert('Please enter a task title');
                return;
            }

            if (!isAdmin) {
                try {
                    const request = {
                        userId: currentUser.uid,
                        userName: currentUser.displayName || 'Unknown',
                        userEmail: currentUser.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        action: 'edit_task',
                        taskTitle: title
                    };

                    const adminRef = db.collection('admins').doc('main');
                    const adminDoc = await adminRef.get();

                    if (!adminDoc.exists) {
                        await adminRef.set({ pendingRequests: [] });
                    }

                    await adminRef.update({
                        pendingRequests: firebase.firestore.FieldValue.arrayUnion(request)
                    });

                    alert('Permission request sent to admin!');
                    closeTaskModal();
                    return;
                } catch (error) {
                    console.error('Error requesting permission:', error);
                    alert('Error sending permission request: ' + error.message);
                    return;
                }
            }

            const taskData = {
                title: title,
                description: description,
                mapLink: mapLink || null,
                dueDate: dueDate,
                priority: priority,
                status: "Pending",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (currentTaskId) {
                    await db.collection("tasks").doc(currentTaskId).update(taskData);
                } else {
                    await db.collection("tasks").add(taskData);
                }
                closeTaskModal();
            } catch (error) {
                console.error('Error saving task:', error);
                alert('Error saving task: ' + error.message);
            }
        }

        function editTask(taskId) {
            if (!isAdmin) {
                alert('Members cannot edit tasks');
                return;
            }

            db.collection("tasks").doc(taskId).get().then((doc) => {
                if (doc.exists) {
                    const task = doc.data();
                    document.getElementById('taskTitle').value = task.title || '';
                    document.getElementById('taskDescription').value = task.description || '';
                    document.getElementById('mapLink').value = task.mapLink || '';
                    document.getElementById('dueDate').value = task.dueDate || '';
                    document.getElementById('priority').value = task.priority || 'Medium';

                    currentTaskId = taskId;
                    openTaskModal();
                }
            });
        }

        function deleteTask(taskId) {
            if (!isAdmin) {
                alert('Members cannot delete tasks');
                return;
            }

            if (confirm('Are you sure you want to delete this task?')) {
                db.collection("tasks").doc(taskId).delete();
            }
        }

        function showTab(tabId) {
            document.getElementById('dashboard').style.display = tabId === 'dashboard' ? 'block' : 'none';
            document.getElementById('tasks').style.display = tabId === 'tasks' ? 'block' : 'none';
        }

        function openTaskModal() {
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
            currentTaskId = null;
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('mapLink').value = '';
            document.getElementById('dueDate').value = '';
            document.getElementById('priority').value = 'Medium';
        }

        // *** LOGOUT FUNCTION ***
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                firebase.auth().signOut().then(() => {
                    // Reset UI state
                    document.getElementById('user-name').textContent = 'User';
                    document.getElementById('role-badge').innerHTML = '';
                    document.getElementById('login-screen').style.display = 'flex';
                    document.getElementById('dashboard-content').style.display = 'none';
                    currentUser = null;
                    isAdmin = false;
                }).catch(error => {
                    console.error('Logout error:', error);
                    alert('Logout failed: ' + error.message);
                });
            }
        }

        window.onclick = function(event) {
            if (event.target.id === 'taskModal') {
                closeTaskModal();
            }
        }
    </script>
</body>
</html>
