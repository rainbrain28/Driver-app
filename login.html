<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚛 DRIVER APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-cyan: #00FFFF;
            --primary-blue: #0066CC;
            --dark-bg: #0a0a2a;
            --card-bg: rgba(10, 10, 42, 0.8);
            --accent-purple: #8A2BE2;
            --success-green: #00FF7F;
            --warning-orange: #FF8C00;
            --danger-red: #FF4500;
            --text-light: #E0E0FF;
            --glow-cyan: 0 0 15px #00FFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, var(--dark-bg) 0%, #000015 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-purple));
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid var(--primary-cyan);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: var(--glow-cyan);
        }

        .nav-tabs {
            display: flex;
            background: rgba(0, 102, 204, 0.3);
            padding: 10px;
            gap: 5px;
        }

        .nav-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-tab.active {
            background: var(--primary-cyan);
            color: var(--dark-bg);
            font-weight: bold;
            border-color: var(--accent-purple);
        }

        .task-management {
            background: rgba(138, 43, 226, 0.1);
            margin: 15px;
            border-radius: 15px;
            padding: 20px;
        }

        .add-task-btn {
            background: linear-gradient(45deg, var(--accent-purple), var(--primary-blue));
            color: white;
            border: 2px solid var(--primary-cyan);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-cyan);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: bold;
            color: var(--primary-cyan);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 42, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--primary-cyan);
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--primary-cyan);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-cyan);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--primary-cyan);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--success-green), #00AA66);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--primary-cyan);
        }
    </style>
</head>
<body>
    <div id="login-screen" class="auth-container">
        <div class="auth-box">
            <h2 style="color: var(--primary-cyan); margin-bottom: 20px;">🚛 DRIVER APP</h2>
            <p style="margin-bottom: 30px;">Sign in to access your dashboard</p>
            <button id="auth-button" class="add-task-btn">🔐 Sign in with Google</button>
        </div>
    </div>

    <div id="dashboard-content" style="display: none;">
        <div class="header">
            <h1>🚀 DRIVER APP</h1>
            <p>Welcome, <span id="user-name">User</span>! 🌟 <span id="role-badge"></span></p>
        </div>

        <div id="tasks" style="display: block;">
            <div class="task-management" id="tasks-container">
                <h3>📋 MANAGE TASKS</h3>
                <button class="add-task-btn" onclick="openTaskModal()" id="add-task-btn">➕ ADD NEW TASK</button>
            </div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTaskModal()">&times;</span>
            <h3 style="color: var(--primary-cyan); margin-bottom: 20px;">📝 TASK DETAILS</h3>

            <div class="form-group">
                <label class="form-label">Task Title</label>
                <input type="text" id="taskTitle" class="form-input" placeholder="Enter task title...">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" id="taskDescription" class="form-input" placeholder="Enter description...">
            </div>

            <div class="form-group">
                <label class="form-label">📍 Location Link (Google Maps/Waze)</label>
                <input type="url" class="form-input" id="mapLink" placeholder="Paste map link here...">
                <small style="color: var(--text-light); opacity: 0.7;">e.g., https://maps.google.com/?q=123+Main+St</small>
            </div>

            <div class="form-group">
                <label class="form-label">Due Date</label>
                <input type="datetime-local" id="dueDate" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Repeat Option</label>
                <select class="form-input" id="repeatOption">
                    <option value="none">📅 None (One-time)</option>
                    <option value="daily">🔄 Daily</option>
                    <option value="weekly">🔄 Weekly</option>
                    <option value="monthly">🔄 Monthly</option>
                    <option value="yearly">🔄 Yearly</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Priority</label>
                <select class="form-input" id="priority">
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>

            <button class="btn-submit" onclick="saveTask()">💾 SAVE TASK</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBsMZFdyciKjpcSufC4IbSxlehQ50zviEQ",
            authDomain: "driver-app-auth-b87de.firebaseapp.com",
            projectId: "driver-app-auth-b87de",
            storageBucket: "driver-app-auth-b87de.firebasestorage.app",
            messagingSenderId: "691923028632",
            appId: "1:691923028632:web:e9813913d01788947c1eed"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentUserRole = null;
        let isAdmin = false;
        let currentTaskId = null;

        auth.onAuthStateChanged(async user => {
            const loginScreen = document.getElementById('login-screen');
            const dashboardContent = document.getElementById('dashboard-content');

            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                dashboardContent.style.display = 'block';
                document.getElementById('user-name').textContent = user.displayName || 'User';

                await getUserRole(user.uid);
                updateUIForRole();
                loadTasks();
            } else {
                loginScreen.style.display = 'flex';
                dashboardContent.style.display = 'none';
            }
        });

        document.getElementById('auth-button').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(result => console.log('Sign in successful', result.user))
                .catch(error => {
                    console.error('Sign in error', error);
                    alert('Login failed: ' + error.message);
                });
        });

        async function getUserRole(userId) {
            try {
                const userDoc = await db.collection('users').doc(userId).get();
                if (userDoc.exists) {
                    currentUserRole = userDoc.data().role || 'member';
                } else {
                    await db.collection('users').doc(userId).set({
                        uid: userId,
                        email: currentUser.email,
                        displayName: currentUser.displayName,
                        role: 'member',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    currentUserRole = 'member';
                }
                isAdmin = (currentUserRole === 'admin');
            } catch (error) {
                console.error('Error getting user role:', error);
                currentUserRole = 'member';
                isAdmin = false;
            }
        }

        function updateUIForRole() {
            const roleBadge = document.getElementById('role-badge');
            const addTaskBtn = document.getElementById('add-task-btn');

            if (isAdmin) {
                roleBadge.innerHTML = '<span class="admin-badge">ADMIN</span>';
                addTaskBtn.disabled = false;
            } else {
                roleBadge.innerHTML = '';
                addTaskBtn.disabled = true;
                alert('You are a member. Admins will manage tasks.');
            }
        }

        function loadTasks() {
            db.collection("tasks").orderBy("createdAt", "desc")
                .onSnapshot((querySnapshot) => {
                    const tasksContainer = document.getElementById('tasks-container');

                    if (!isAdmin) {
                        tasksContainer.innerHTML = `
                            <h3>📋 TASKS</h3>
                            <p style="color: var(--warning-orange);">You are a member. Admins manage all tasks.</p>
                        `;
                        return;
                    }

                    tasksContainer.innerHTML = `
                        <h3>📋 MANAGE TASKS</h3>
                        <button class="add-task-btn" onclick="openTaskModal()">➕ ADD NEW TASK</button>
                    `;

                    querySnapshot.forEach((doc) => {
                        const task = doc.data();
                        const taskElement = document.createElement('div');
                        taskElement.className = 'task-card';

                        taskElement.innerHTML = `
                            <div class="task-header">
                                <span class="task-title">${task.title}</span>
                                <div class="task-actions">
                                    <i class="fas fa-edit edit-btn" onclick="editTask('${doc.id}')"></i>
                                    <i class="fas fa-trash delete-btn" onclick="deleteTask('${doc.id}')"></i>
                                </div>
                            </div>
                            <div>Due: ${task.dueDate || 'No date'}</div>
                            <div>Priority: ${task.priority}</div>
                        `;
                        tasksContainer.appendChild(taskElement);
                    });
                });
        }

        // *** FIXED saveTask function - Using proper element IDs ***
        async function saveTask() {
            if (!currentUser) {
                alert('Please sign in first');
                return;
            }

            // *** FIXED: Use proper element IDs to avoid null references ***
            const titleInput = document.getElementById('taskTitle');
            const descriptionInput = document.getElementById('taskDescription');
            const mapLinkInput = document.getElementById('mapLink');
            const dueDateInput = document.getElementById('dueDate');
            const repeatSelect = document.getElementById('repeatOption');
            const prioritySelect = document.getElementById('priority');

            // Validate inputs exist
            if (!titleInput || !descriptionInput || !mapLinkInput ||
                !dueDateInput || !repeatSelect || !prioritySelect) {
                alert('Error: Form elements not found. Please refresh the page.');
                console.error('Missing form elements:', {
                    titleInput, descriptionInput, mapLinkInput,
                    dueDateInput, repeatSelect, prioritySelect
                });
                return;
            }

            const title = titleInput.value.trim();
            const description = descriptionInput.value.trim();
            const mapLink = mapLinkInput.value.trim();
            const dueDate = dueDateInput.value;
            const repeat = repeatSelect.value;
            const priority = prioritySelect.value;

            if (!title) {
                alert('Please enter a task title');
                return;
            }

            // Check permission for members
            if (!isAdmin) {
                try {
                    // *** FIXED: Create request object FIRST, then use arrayUnion ***
                    const request = {
                        userId: currentUser.uid,
                        userName: currentUser.displayName || 'Unknown',
                        userEmail: currentUser.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        action: 'edit_task',
                        taskTitle: title
                    };

                    const adminRef = db.collection('admins').doc('main');
                    const adminDoc = await adminRef.get();

                    if (!adminDoc.exists) {
                        await adminRef.set({
                            pendingRequests: []
                        });
                    }

                    // *** NOW use arrayUnion with the pre-created request object ***
                    await adminRef.update({
                        pendingRequests: firebase.firestore.FieldValue.arrayUnion(request)
                    });

                    alert('Permission request sent to admin!');
                    closeTaskModal();
                    return;
                } catch (error) {
                    console.error('Error requesting permission:', error);
                    alert('Error sending permission request: ' + error.message);
                    return;
                }
            }

            // Admin tasks save directly
            const taskData = {
                title: title,
                description: description,
                mapLink: mapLink || null,
                dueDate: dueDate,
                priority: priority,
                status: "Pending",
                repeat: repeat !== 'none' ? repeat : null,
                createdBy: currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (currentTaskId) {
                    await db.collection("tasks").doc(currentTaskId).update(taskData);
                    console.log('Task updated successfully');
                } else {
                    await db.collection("tasks").add(taskData);
                    console.log('Task added successfully');
                }
                closeTaskModal();
            } catch (error) {
                console.error('Error saving task:', error);
                alert('Error saving task: ' + error.message);
            }
        }

        function loadUsers() {
            if (!isAdmin) return;

            db.collection('users').orderBy('createdAt', 'desc')
                .onSnapshot((querySnapshot) => {
                    const usersContainer = document.getElementById('users-container');
                    if (!usersContainer) return;

                    usersContainer.innerHTML = '';

                    querySnapshot.forEach((doc) => {
                        const user = doc.data();
                        const userElement = document.createElement('div');
                        userElement.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; margin-bottom: 10px; border-radius: 10px; border-left: 4px solid ${user.role === 'admin' ? 'var(--warning-orange)' : 'var(--primary-cyan)'};">
                                <div>
                                    <strong>${user.displayName || user.email}</strong>
                                    <br>
                                    <small>${user.email}</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-size: 12px; color: ${user.role === 'admin' ? 'var(--warning-orange)' : 'var(--primary-cyan)'};">
                                        ${user.role === 'admin' ? '👑 Admin' : '👤 Member'}
                                    </span>
                                    ${user.uid !== currentUser.uid ? (user.role === 'admin' ?
                                        '<button onclick="setMember(\'' + doc.id + '\')" style="background: var(--primary-cyan); border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer;">Make Member</button>' :
                                        '<button onclick="setAdmin(\'' + doc.id + '\')" style="background: var(--warning-orange); border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer;">Make Admin</button>'
                                    ) : ''}
                                </div>
                            </div>
                        `;
                        usersContainer.appendChild(userElement);
                    });
                });
        }

        async function setAdmin(userId) {
            if (confirm('Make this user an admin?')) {
                try {
                    await db.collection('users').doc(userId).update({ role: 'admin' });
                } catch (error) {
                    console.error('Error updating role:', error);
                    alert('Error: ' + error.message);
                }
            }
        }

        async function setMember(userId) {
            if (confirm('Make this user a member?')) {
                try {
                    await db.collection('users').doc(userId).update({ role: 'member' });
                } catch (error) {
                    console.error('Error updating role:', error);
                    alert('Error: ' + error.message);
                }
            }
        }

        function editTask(taskId) {
            if (!isAdmin) {
                alert('Members cannot edit tasks');
                return;
            }

            db.collection("tasks").doc(taskId).get().then((doc) => {
                if (doc.exists) {
                    const task = doc.data();
                    document.getElementById('taskTitle').value = task.title || '';
                    document.getElementById('taskDescription').value = task.description || '';
                    document.getElementById('mapLink').value = task.mapLink || '';
                    document.getElementById('dueDate').value = task.dueDate || '';
                    document.getElementById('repeatOption').value = task.repeat || 'none';
                    document.getElementById('priority').value = task.priority || 'Medium';

                    currentTaskId = taskId;
                    openTaskModal();
                }
            }).catch(error => {
                console.error('Error getting task:', error);
            });
        }

        function deleteTask(taskId) {
            if (!isAdmin) {
                alert('Members cannot delete tasks');
                return;
            }

            if (confirm('Are you sure you want to delete this task?')) {
                db.collection("tasks").doc(taskId).delete().catch(error => {
                    console.error('Error deleting task:', error);
                });
            }
        }

        function openTaskModal() {
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
            currentTaskId = null;

            // Clear form
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('mapLink').value = '';
            document.getElementById('dueDate').value = '';
            document.getElementById('repeatOption').value = 'none';
            document.getElementById('priority').value = 'Medium';
        }

        window.onclick = function(event) {
            if (event.target.id === 'taskModal') {
                closeTaskModal();
            }
        }
    </script>
</body>
</html>
